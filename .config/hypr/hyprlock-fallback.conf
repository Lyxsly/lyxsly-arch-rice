# Used only when the Quickshell lock handler is unavailable.
general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(141314ff)
}

input-field {
    monitor =
    size = 280, 60
    outline_thickness = 2
    inner_color = rgba(211f20ff)
    outer_color = rgba(d1c2d2ff)
    font_color = rgba(e7e1e3ff)
    font_family = Monospace
    placeholder_text = Password...
    fail_text = $PAMFAIL
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}
