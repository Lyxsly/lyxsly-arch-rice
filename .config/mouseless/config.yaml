baseMouseSpeed: 700.0
baseScrollSpeed: 20.0

mouseAccelerationTime: 250.0
mouseAccelerationCurve: 2.0
startMouseSpeed: 0.0

# mouseDecelerationTime: 300.0
# mouseDecelerationCurve: 3.0

layers:
  - name: initial
    bindings:
      rightctrl: toggle-layer mouse
      rightshift+rightctrl: layer mouse

  - name: mouse
    passThrough: true
    bindings:
      a: move -1 0
      s: move 0 1
      w: move 0 -1
      d: move 1 0

      j: button left
      l: button right

      e: scroll up
      f: scroll down
