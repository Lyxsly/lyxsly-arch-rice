baseMouseSpeed: 750.0
baseScrollSpeed: 20.0

layers:
  - name: initial
    bindings:
      righttrl: toggle-layer mouse

  - name: mouse
    passThrough: true
    bindings:
      h: move -1 0
      j: move 0 1
      k: move 0 -1
      l: move 1 0

      f: button left
      s: button right

      u: scroll up
      d: scroll down

      leftshift: speed 4.0
      leftctrl: speed 0.25
