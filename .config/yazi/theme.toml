# : Manager [[[

[mgr]
cwd = { fg = "#dfe3e7" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#a377ff", bg = "#a377ff" }
marker_cut      = { fg = "#e8ddff", bg = "#e8ddff" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#cdc0e9", bg = "#cdc0e9" }

# Count
count_copied   = { fg = "#1e1635", bg = "#e8ddff" }
count_cut      = { fg = "#1e1635", bg = "#e8ddff" }
count_selected = { fg = "#00344c", bg = "#cdc0e9" }

# Border
border_symbol = "│"
border_style  = { fg = "#93cdf6" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#93cdf6", bold = true, bg = "#0a0f12" }
inactive  = { fg = "#374955", bg = "#0a0f12" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#93cdf6", fg = "#00344c", bold = true }
normal_alt  = { bg = "#41484d", fg = "#c1c7ce" }

# Select mode
select_main = { bg = "#b6c9d8", fg = "#21323e", bold = true }
select_alt  = { bg = "#41484d", fg = "#c1c7ce" }

# Unset mode
unset_main = { bg = "#cdc0e9", fg = "#342b4b", bold = true }
unset_alt  = { bg = "#41484d", fg = "#c1c7ce" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#557fa0" }
perm_write = { fg = "#734fc1" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#8144ff" }
perm_sep   = { fg = "#2ea5ff" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#93cdf6", bg = "#353a3d" }
progress_error  = { fg = "#ffb4ab", bg = "#353a3d" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#353a3d" }
cand = { fg = "#93cdf6" }
rest = { fg = "#00344c" }
desc = { fg = "#dfe3e7" }
separator = " ▶ "
separator_style = { fg = "#dfe3e7" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#cdc0e9" }
title_warn  = { fg = "#93cdf6" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#93cdf6" }
active = { fg = "#cdc0e9", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#93cdf6" }
value  = { fg = "#dfe3e7" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#93cdf6", bg = "#00344c" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#93cdf6" }
title   = {}
hovered = { fg = "#e8ddff", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#dfe3e7" }
run    = { fg = "#dfe3e7" }
footer = { fg = "#21323e", bg = "#b6c9d8" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { url = "*", is = "orphan", bg = "#93000a" },
    { url = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#dfe3e7" },
    { url = "*/", fg = "#93cdf6" },
]

# : ]]]
