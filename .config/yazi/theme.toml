# : Manager [[[

[mgr]
cwd = { fg = "#dee3e6" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#797dff", bg = "#797dff" }
marker_cut      = { fg = "#dfe0ff", bg = "#dfe0ff" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#c1c4eb", bg = "#c1c4eb" }

# Count
count_copied   = { fg = "#151937", bg = "#dfe0ff" }
count_cut      = { fg = "#151937", bg = "#dfe0ff" }
count_selected = { fg = "#003642", bg = "#c1c4eb" }

# Border
border_symbol = "│"
border_style  = { fg = "#86d1ea" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#86d1ea", bold = true, bg = "#0a0f11" }
inactive  = { fg = "#344a52", bg = "#0a0f11" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#86d1ea", fg = "#003642", bold = true }
normal_alt  = { bg = "#40484b", fg = "#bfc8cc" }

# Select mode
select_main = { bg = "#b3cad4", fg = "#1d333b", bold = true }
select_alt  = { bg = "#40484b", fg = "#bfc8cc" }

# Unset mode
unset_main = { bg = "#c1c4eb", fg = "#2a2e4d", bold = true }
unset_alt  = { bg = "#40484b", fg = "#bfc8cc" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#568498" }
perm_write = { fg = "#4d56c6" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#464cff" }
perm_sep   = { fg = "#1ac3ff" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#86d1ea", bg = "#343a3c" }
progress_error  = { fg = "#ffb4ab", bg = "#343a3c" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#343a3c" }
cand = { fg = "#86d1ea" }
rest = { fg = "#003642" }
desc = { fg = "#dee3e6" }
separator = " ▶ "
separator_style = { fg = "#dee3e6" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#c1c4eb" }
title_warn  = { fg = "#86d1ea" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#86d1ea" }
active = { fg = "#c1c4eb", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#86d1ea" }
value  = { fg = "#dee3e6" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#86d1ea", bg = "#003642" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#86d1ea" }
title   = {}
hovered = { fg = "#dfe0ff", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#dee3e6" }
run    = { fg = "#dee3e6" }
footer = { fg = "#1d333b", bg = "#b3cad4" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { url = "*", is = "orphan", bg = "#93000a" },
    { url = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#dee3e6" },
    { url = "*/", fg = "#86d1ea" },
]

# : ]]]
