# : Manager [[[

[mgr]
cwd = { fg = "#efe0d5" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#bcd065", bg = "#bcd065" }
marker_cut      = { fg = "#dee8b3", bg = "#dee8b3" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#c2cc99", bg = "#c2cc99" }

# Count
count_copied   = { fg = "#171e00", bg = "#dee8b3" }
count_cut      = { fg = "#171e00", bg = "#dee8b3" }
count_selected = { fg = "#4b2800", bg = "#c2cc99" }

# Border
border_symbol = "│"
border_style  = { fg = "#feb877" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#feb877", bold = true, bg = "#130d07" }
inactive  = { fg = "#59422d", bg = "#130d07" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#feb877", fg = "#4b2800", bold = true }
normal_alt  = { bg = "#51443a", fg = "#d5c3b6" }

# Select mode
select_main = { bg = "#e2c0a4", fg = "#412c19", bold = true }
select_alt  = { bg = "#51443a", fg = "#d5c3b6" }

# Unset mode
unset_main = { bg = "#c2cc99", fg = "#2c340f", bold = true }
unset_alt  = { bg = "#51443a", fg = "#d5c3b6" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#b47139" }
perm_write = { fg = "#7b8844" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#abc43e" }
perm_sep   = { fg = "#ff8727" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#feb877", bg = "#403730" }
progress_error  = { fg = "#ffb4ab", bg = "#403730" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#403730" }
cand = { fg = "#feb877" }
rest = { fg = "#4b2800" }
desc = { fg = "#efe0d5" }
separator = " ▶ "
separator_style = { fg = "#efe0d5" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#c2cc99" }
title_warn  = { fg = "#feb877" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#feb877" }
active = { fg = "#c2cc99", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#feb877" }
value  = { fg = "#efe0d5" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#feb877", bg = "#4b2800" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#feb877" }
title   = {}
hovered = { fg = "#dee8b3", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#efe0d5" }
run    = { fg = "#efe0d5" }
footer = { fg = "#412c19", bg = "#e2c0a4" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { url = "*", is = "orphan", bg = "#93000a" },
    { url = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#efe0d5" },
    { url = "*/", fg = "#feb877" },
]

# : ]]]
